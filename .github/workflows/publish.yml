name: Publish to pub.dev

# pub.dev's automated-publishing policy on this package only accepts
# OIDC tokens whose event claim is ``workflow_dispatch``. Both
# ``release`` and ``push`` events are rejected with:
#
#   "publishing is not allowed from 'release' events"
#   "publishing is not allowed from 'push' events"
#
# See https://dart.dev/go/publishing-from-github
#
# Workflow is manual-only: after cutting a GitHub release with tag
# ``v<version>``, go to **Actions → Publish to pub.dev → Run workflow**
# and pick the release tag from the "Use workflow from" dropdown.
# The reusable workflow handles dry-run, version-vs-tag check, and the
# actual ``dart pub publish``.
#
# Auth: pub.dev automated publishing via OIDC. One-time setup on pub.dev:
#   1. Sign in to pub.dev with the publisher account that owns the package.
#   2. Go to pub.dev/packages/tgram_analytics/admin → "Automated publishing".
#   3. Enable "Publish from GitHub Actions" with:
#        Repository: tgram-analytics/tgram-analytics-flutter
#        Tag pattern: v{{version}}
#        Require GitHub Actions environment: pub.dev
on:
  workflow_dispatch:

jobs:
  # ``environment: pub.dev`` is passed through to the reusable workflow's
  # inner job so it binds to the GitHub Actions environment named
  # ``pub.dev`` (which the pub.dev policy requires).
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
