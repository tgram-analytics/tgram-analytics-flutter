name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The repository's Actions policy allows only GitHub-owned and
    # Marketplace-verified actions, so dart-lang/setup-dart is not usable.
    # The official Dart Docker image provides the SDK instead.
    container:
      image: dart:${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Show Dart version
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Unit tests
        run: dart test
